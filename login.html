<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | FinanzasPro</title>
    <!-- Bootstrap 5.3 -->
    <link href="css/lib/bootstrap-5.3.0.min.css" rel="stylesheet">
    <!-- Google Fonts (Poppins) -->
    <link href="css/lib/fonts-google-Poppins-css2.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="css/lib/font-awesome-6.4.0-all.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">

    <script>
        const savedTheme = localStorage.getItem('finanzaspro_theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
</head>
<body>

    <button type="button" id="btnToggleAuthTheme" class="btn glass auth-theme-toggle rounded-circle d-flex align-items-center justify-content-center p-0" title="Cambiar tema">
        <i class="fas fa-moon" id="authThemeIcon"></i>
    </button>

    <div class="auth-wrapper">
        <div class="glass auth-card">

            <!-- <div class="auth-brand">
                <div class="brand-icon bg-primary text-white rounded p-2 d-flex align-items-center justify-content-center" style="width: 42px; height: 42px; min-width: 42px;">
                    <i class="fas fa-wallet"></i>
                </div>
                <h4 class="mb-0 fw-bold">FinanzasPro</h4>
            </div> -->

            <h5 class="fw-bold mb-1 text-center mb-4">Iniciar Sesión</h5>
            <!-- <p class="text-muted small text-center mb-4">Ingresa tus credenciales para acceder a tu cuenta.</p> -->

            <div id="loginAlert" class="alert alert-danger small py-2 px-3 d-none" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label text-muted small">Correo Electrónico</label>
                    <input type="email" id="loginEmail" class="form-control glass-input" placeholder="tucorreo@ejemplo.com" required>
                    <div class="invalid-feedback">El correo electrónico es obligatorio y debe ser válido.</div>
                </div>

                <div class="mb-2">
                    <label for="loginPassword" class="form-label text-muted small">Contraseña</label>
                    <div class="position-relative">
                        <input type="password" id="loginPassword" class="form-control glass-input pe-5" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" data-target="loginPassword" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">La contraseña es obligatoria.</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted small" for="rememberMe">Recordarme</label>
                    </div>
                    <a href="forgot-password.html" class="small fw-medium">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="border-radius: 10px;">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                </button>
            </form>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="js/lib/bootstrap.bundle.min.js"></script>
    <!-- Lógica compartida de autenticación (tema y mostrar/ocultar contraseña) -->
    <script src="js/auth.js"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const form = e.target;
            const alertBox = document.getElementById('loginAlert');
            alertBox.classList.add('d-none');

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            form.classList.add('was-validated');

            // Simulación de autenticación: en un entorno real aquí se validarían
            // las credenciales contra el servidor antes de redirigir.
            window.location.href = '/';
        });
    </script>
</body>
</html>
